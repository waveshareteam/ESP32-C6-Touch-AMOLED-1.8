name: Build Examples

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "all, an example name, or a repo-relative example path"
        required: false
        default: "all"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lightweight:
    name: Lightweight routing and Markdown gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Run static routing and Markdown tests
        run: python3 -m unittest discover -s tests -p 'test_*.py'
      - name: Audit Markdown in the pull-request base scope
        if: github.event_name == 'pull_request'
        run: >-
          python3 scripts/audit_markdown.py . --base "${{ github.event.pull_request.base.sha }}"
          --strict --config config/markdown-audit-config.json
      - name: Audit the complete repository scope
        if: github.event_name != 'pull_request'
        run: >-
          python3 scripts/audit_markdown.py . --all
          --strict --config config/markdown-audit-config.json

  discover-esp-idf:
    needs: lightweight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SELECTOR="$DISPATCH_TARGET"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            SELECTOR=""
          else
            SELECTOR="all"
          fi
          python3 scripts/discover_examples.py --surface esp-idf --selector "$SELECTOR" --base-ref "$BASE_REF" --head-ref "${{ github.sha }}" --idf-versions v5.5.5,v6.0.2 --github-output "$GITHUB_OUTPUT"

  discover-arduino:
    needs: lightweight
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.discover.outputs.matrix }}
      count: ${{ steps.discover.outputs.count }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: discover
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TARGET: ${{ github.event.inputs.target }}
          BASE_REF: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            SELECTOR="$DISPATCH_TARGET"
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            SELECTOR=""
          else
            SELECTOR="all"
          fi
          python3 scripts/discover_examples.py --surface arduino --selector "$SELECTOR" --base-ref "$BASE_REF" --head-ref "${{ github.sha }}" --arduino-core 3.3.11 --fqbn esp32:esp32:esp32c6:FlashSize=16M,PartitionScheme=app3M_fat9M_16MB --github-output "$GITHUB_OUTPUT"

  build-esp-idf:
    needs: discover-esp-idf
    if: needs.discover-esp-idf.outputs.count != '0'
    runs-on: ubuntu-latest
    container: espressif/idf:${{ matrix.idf }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-esp-idf.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - name: Build ${{ matrix.path }} with ESP-IDF ${{ matrix.idf }}
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py --version
          BUILD_DIR="$GITHUB_WORKSPACE/build/${{ matrix.name }}-${{ matrix.idf }}"
          idf.py -C "${{ matrix.path }}" -B "$BUILD_DIR" set-target esp32c6 build
      - name: Package firmware
        shell: bash
        run: |
          BUILD_DIR="$GITHUB_WORKSPACE/build/${{ matrix.name }}-${{ matrix.idf }}"
          python3 releases/package_firmware.py --framework esp-idf --project "${{ matrix.path }}" --build-dir "$BUILD_DIR" --name "ESP32-C6-Touch-AMOLED-1.8-${{ matrix.name }}-esp-idf-${{ matrix.idf }}-esp32c6" --framework-version "${{ matrix.idf }}" --target esp32c6 --git-sha "${{ github.sha }}" --output-dir release-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-esp-idf-${{ matrix.name }}-${{ matrix.idf }}
          path: release-artifacts/*.zip
          if-no-files-found: error

  build-arduino:
    needs: discover-arduino
    if: needs.discover-arduino.outputs.count != '0'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.discover-arduino.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 Arduino core
        run: |
          arduino-cli config init --overwrite
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@${{ matrix.core }}
      - name: Compile ${{ matrix.path }}
        run: arduino-cli compile --fqbn "${{ matrix.fqbn }}" --libraries "${{ matrix.libraries }}" --export-binaries --output-dir "build/${{ matrix.name }}-${{ matrix.core }}" "${{ matrix.path }}"
      - name: Package firmware
        run: python3 releases/package_firmware.py --framework arduino --project "${{ matrix.path }}" --build-dir "build/${{ matrix.name }}-${{ matrix.core }}" --name "ESP32-C6-Touch-AMOLED-1.8-${{ matrix.name }}-arduino-${{ matrix.core }}-esp32c6" --framework-version "${{ matrix.core }}" --target esp32c6 --git-sha "${{ github.sha }}" --output-dir release-artifacts
      - uses: actions/upload-artifact@v7
        with:
          name: firmware-arduino-${{ matrix.name }}-${{ matrix.core }}
          path: release-artifacts/*.zip
          if-no-files-found: error
